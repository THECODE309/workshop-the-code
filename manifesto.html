
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#21170f">
  <title>The Manifesto | THE CODE</title>
  <meta name="description" content="We don't sell clothing. We create symbols. Every Code represents a value. Every value defines a person.">

  <style>
    :root {
      --cream: #f2f0ea;
      --bronze: #c18b52;
      --dark: #21170f;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--dark);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--cream);
      background-color: var(--dark);
    }

    .manifesto-page {
      min-height: 100vh;
      min-height: 100svh;
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      overflow: hidden;
      background-image:
        linear-gradient(
          rgba(20, 14, 9, 0.60),
          rgba(20, 14, 9, 0.70)
        ),
        url("assets/manifesto-background.jpg");
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .manifesto-page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(
          ellipse at center,
          rgba(22, 15, 9, 0.08) 0%,
          rgba(22, 15, 9, 0.30) 75%,
          rgba(0, 0, 0, 0.48) 100%
        );
      pointer-events: none;
    }

    .manifesto-content {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      text-align: center;
      position: relative;
      padding: 28px 18px;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.60);
    }

    .eyebrow {
      color: var(--bronze);
      font-size: 10px;
      letter-spacing: 0.48em;
      text-transform: uppercase;
      margin-bottom: 32px;
      font-weight: 500;
    }

    h1 {
      font-family: Inter, Arial, Helvetica, sans-serif;
      font-size: clamp(48px, 9vw, 112px);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.065em;
      text-transform: uppercase;
      margin: 0;
      color: var(--cream);
    }

    h1 span {
      display: block;
    }

    .divider {
      width: 54px;
      height: 1px;
      background: var(--bronze);
      margin: 40px auto 42px;
    }

    .manifesto-copy {
      max-width: 760px;
      margin: 0 auto;
      font-size: clamp(14px, 1.5vw, 17px);
      line-height: 1.9;
      font-weight: 400;
      color: #f2f0ea;
    }

    .manifesto-copy p {
      margin: 0 0 24px;
    }

    .manifesto-copy strong {
      font-weight: 700;
      color: #ffffff;
    }

    .actions {
      margin-top: 52px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .discover-button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 24px;
      min-width: 320px;
      min-height: 64px;
      padding: 18px 28px;
      border: 2px solid var(--bronze);
      background: rgba(15, 10, 6, 0.72);
      color: #e5ad6c;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-shadow: none;
      transition:
        background 0.25s ease,
        color 0.25s ease,
        border-color 0.25s ease;
    }

    .discover-button .arrow {
      font-size: 23px;
      line-height: 1;
      letter-spacing: 0;
    }

    .discover-button:hover,
    .discover-button:focus-visible {
      background: var(--bronze);
      color: #17110c;
      border-color: #e2b17b;
      outline: none;
    }

    .back-link {
      display: inline-block;
      color: rgba(242, 240, 234, 0.75);
      text-decoration: none;
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      text-shadow: 0 2px 8px #000;
      transition: color 0.2s ease;
    }

    .back-link:hover,
    .back-link:focus-visible {
      color: var(--bronze);
    }

    @media (max-width: 600px) {
      .manifesto-page {
        padding: 30px 16px;
        background-position: center center;
      }

      .manifesto-content {
        padding: 24px 4px;
      }

      .eyebrow {
        margin-bottom: 26px;
        letter-spacing: 0.36em;
      }

      h1 {
        font-size: clamp(43px, 12vw, 68px);
        letter-spacing: -0.06em;
      }

      .divider {
        margin: 30px auto;
      }

      .manifesto-copy {
        font-size: 14px;
        line-height: 1.8;
      }

      .manifesto-copy p {
        margin-bottom: 20px;
      }

      .actions {
        margin-top: 36px;
      }

      .discover-button {
        min-width: 0;
        width: min(100%, 330px);
        min-height: 60px;
        gap: 14px;
        padding: 16px 14px;
        font-size: 10px;
        letter-spacing: 0.16em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="manifesto-page">
    <section class="manifesto-content" aria-labelledby="manifesto-title">

      <div class="eyebrow">THE CODE</div>

      <h1 id="manifesto-title">
        <span>THE</span>
        <span>MANIFESTO</span>
      </h1>

      <div class="divider" aria-hidden="true"></div>

      <div class="manifesto-copy">
        <p>
          We don't sell clothing. We create symbols.
        </p>

        <p>
          Every Code represents a value.
          Every value defines a person.
        </p>

        <p>
          The garment is only the beginning.
          <strong>The Code lives in the one who wears it.</strong>
        </p>
      </div>

      <nav class="actions" aria-label="Manifesto navigation">

        <a class="discover-button" href="code-destinations.html">
          <span>DISCOVER YOUR CODE</span>
          <span class="arrow" aria-hidden="true">→</span>
        </a>

        <a class="back-link" href="index.html">
          ← BACK
        </a>

      </nav>

    </section>
  </main>
</body>
</html>
