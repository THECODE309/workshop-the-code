
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#21170f">

  <title>The Manifesto | THE CODE</title>

  <meta name="description" content="We don't sell clothing. We create symbols. Every Code represents a value. Every value defines a person.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --manifesto-cream: #f2f0ea;
      --manifesto-bronze: #c18b52;
      --manifesto-dark: #21170f;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--manifesto-dark);
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      color: var(--manifesto-cream);
      background: var(--manifesto-dark);
    }

    .manifesto-page {
      position: relative;
      isolation: isolate;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: 48px 24px;
      overflow: hidden;
      background-color: var(--manifesto-dark);
      background-image:
        linear-gradient(
          rgba(20, 14, 9, 0.60),
          rgba(20, 14, 9, 0.70)
        ),
        url("./assets/manifesto-background.png");
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .manifesto-page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(22, 15, 9, 0.08) 0%,
        rgba(22, 15, 9, 0.30) 75%,
        rgba(0, 0, 0, 0.48) 100%
      );
    }

    .manifesto-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 28px 18px;
      text-align: center;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.60);
    }

    .manifesto-eyebrow {
      margin: 0 0 32px;
      color: var(--manifesto-bronze);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.48em;
      line-height: 1.5;
      text-transform: uppercase;
    }

    .manifesto-title {
      margin: 0;
      color: var(--manifesto-cream);
      font-family: 'Inter', Arial, Helvetica, sans-serif;
      font-size: clamp(48px, 9vw, 112px);
      font-weight: 900;
      line-height: 0.92;
      letter-spacing: -0.065em;
      text-transform: uppercase;
      text-shadow: 0 2px 14px rgba(0, 0, 0, 0.35);
    }

    .manifesto-title span {
      display: block;
      margin: 0;
      padding: 0;
    }

    .manifesto-divider {
      width: 54px;
      height: 1px;
      margin: 40px auto 42px;
      background: var(--manifesto-bronze);
    }

    .manifesto-copy {
      max-width: 760px;
      margin: 0 auto;
      color: var(--manifesto-cream);
      font-size: clamp(14px, 1.5vw, 17px);
      font-weight: 400;
      line-height: 1.9;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .manifesto-copy p {
      margin: 0 0 24px;
      padding: 0;
    }

    .manifesto-copy strong {
      color: #fff;
      font-weight: 700;
    }

    .manifesto-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      margin-top: 52px;
    }

    .manifesto-discover {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      width: min(100%, 320px);
      min-height: 64px;
      margin: 0;
      padding: 18px 20px;
      border: 2px solid var(--manifesto-bronze);
      background: rgba(15, 10, 6, 0.82);
      color: #e5ad6c;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.20em;
      line-height: 1.4;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
      text-shadow: none;
      transition: background 0.25s ease, color 0.25s ease;
    }

    .manifesto-discover .manifesto-arrow {
      flex: 0 0 auto;
      font-size: 23px;
      line-height: 1;
      letter-spacing: 0;
    }

    .manifesto-discover:hover,
    .manifesto-discover:focus-visible {
      background: var(--manifesto-bronze);
      color: #17110c;
      outline: none;
    }

    .manifesto-back {
      display: inline-block;
      margin: 0;
      padding: 4px 8px;
      color: rgba(242, 240, 234, 0.85);
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 0.28em;
      line-height: 1.6;
      text-decoration: none;
      text-transform: uppercase;
      text-shadow: 0 2px 8px #000;
    }

    .manifesto-back:hover,
    .manifesto-back:focus-visible {
      color: var(--manifesto-bronze);
    }

    @media (max-width: 600px) {
      .manifesto-page {
        padding: 30px 16px;
        background-position: center center;
      }

      .manifesto-content {
        padding: 24px 4px;
      }

      .manifesto-eyebrow {
        margin-bottom: 26px;
        letter-spacing: 0.36em;
      }

      .manifesto-title {
        font-size: clamp(40px, 11.5vw, 68px);
        letter-spacing: -0.06em;
      }

      .manifesto-divider {
        margin: 30px auto;
      }

      .manifesto-copy {
        font-size: 14px;
        line-height: 1.8;
      }

      .manifesto-copy p {
        margin-bottom: 20px;
      }

      .manifesto-actions {
        gap: 18px;
        margin-top: 36px;
      }

      .manifesto-discover {
        width: min(100%, 330px);
        min-height: 60px;
        gap: 12px;
        padding: 16px 12px;
        font-size: 10px;
        letter-spacing: 0.14em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .manifesto-discover {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="manifesto-page">
    <section class="manifesto-content" aria-labelledby="manifesto-title">

      <p class="manifesto-eyebrow">THE CODE</p>

      <h1 class="manifesto-title" id="manifesto-title">
        <span>THE</span>
        <span>MANIFESTO</span>
      </h1>

      <div class="manifesto-divider" aria-hidden="true"></div>

      <div class="manifesto-copy">
        <p>We don't sell clothing. We create symbols.</p>

        <p>
          Every Code represents a value.
          Every value defines a person.
        </p>

        <p>
          The garment is only the beginning.
          <strong>The Code lives in the one who wears it.</strong>
        </p>
      </div>

      <nav class="manifesto-actions" aria-label="Manifesto navigation">
        <a class="manifesto-discover" href="code-destinations.html">
          <span>DISCOVER YOUR CODE</span>
          <span class="manifesto-arrow" aria-hidden="true">→</span>
        </a>

        <a class="manifesto-back" href="index.html">
          ← BACK
        </a>
      </nav>

    </section>
  </main>
</body>
</html>
