<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WORKSHOP — THE CODE | Manifesto</title>

  <meta
    name="description"
    content="WORKSHOP — THE CODE. Built by Work. Defined by Values."
  >

  <!-- GOOGLE FONT -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet"
  >


  <style>

    /* =====================================================
       WORKSHOP — THE CODE
       MANIFESTO
       ===================================================== */


    :root {

      --black: #0d0d0d;

      --black-soft: #121212;

      --white: #f5f3ef;

      --muted: #aaa7a0;

      --brown: #8a5a38;

      --line: rgba(245,243,239,.18);

    }


    /* =====================================================
       RESET
       ===================================================== */

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }


    html {

      scroll-behavior: smooth;

    }


    body {

      min-height: 100vh;

      background: var(--black);

      color: var(--white);

      font-family: 'Inter', sans-serif;

      overflow-x: hidden;

    }


    a {

      color: inherit;

      text-decoration: none;

    }


    /* =====================================================
       PAGE
       ===================================================== */

    .page {

      min-height: 100vh;

      display: flex;

      flex-direction: column;

    }


    /* =====================================================
       HEADER
       ===================================================== */

    header {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      padding: 34px 5vw;

      z-index: 10;

    }


    .brand {

      display: inline-flex;

      flex-direction: column;

      align-items: flex-start;

    }


    .brand-main {

      font-size: 1.35rem;

      font-weight: 700;

      letter-spacing: .20em;

      line-height: 1;

    }


    .brand-sub {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 9px;

    }


    .brand-sub .line {

      width: 38px;

      height: 1px;

      background: var(--brown);

    }


    .brand-sub span:last-child {

      font-size: .62rem;

      letter-spacing: .35em;

      color: var(--brown);

    }


    /* =====================================================
       MANIFESTO
       ===================================================== */

    main {

      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 130px 24px 80px;

    }


    .manifesto {

      width: min(900px, 90vw);

      text-align: center;

    }


    /* EYEBROW */

    .eyebrow {

      font-size: .62rem;

      letter-spacing: .42em;

      color: var(--brown);

      text-transform: uppercase;

      margin-bottom: 28px;

    }


    /* TITLE */

    h1 {

      font-size: clamp(4rem, 9vw, 8rem);

      line-height: .88;

      font-weight: 800;

      letter-spacing: -.045em;

      text-transform: uppercase;

    }


    /* DIVIDER */

    .divider {

      width: 55px;

      height: 1px;

      background: var(--brown);

      margin: 45px auto 42px;

    }


    /* TEXT */

    .manifesto-text {

      max-width: 620px;

      margin: 0 auto;

      color: var(--muted);

      font-size: .95rem;

      line-height: 1.9;

      font-weight: 300;

    }


    .manifesto-text strong {

      color: var(--white);

      font-weight: 400;

    }


    /* =====================================================
       CTA
       ===================================================== */

    .cta {

      margin-top: 55px;

    }


    .discover {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 18px;

      min-width: 245px;

      padding: 18px 30px;

      border: 1px solid rgba(138,90,56,.75);

      color: var(--brown);

      font-size: .62rem;

      letter-spacing: .30em;

      text-transform: uppercase;

      transition:

        background .35s ease,

        color .35s ease,

        border-color .35s ease;

    }


    .discover span {

      font-size: 1rem;

      transition:

        transform .3s ease;

    }


    .discover:hover {

      background: var(--brown);

      border-color: var(--brown);

      color: var(--white);

    }


    .discover:hover span {

      transform: translateX(6px);

    }


    /* =====================================================
       BACK
       ===================================================== */

    .back {

      display: block;

      margin-top: 28px;

      color: #6f6c67;

      font-size: .55rem;

      letter-spacing: .25em;

      text-transform: uppercase;

      transition: color .3s ease;

    }


    .back:hover {

      color: var(--white);

    }


    /* =====================================================
       FOOTER
       ===================================================== */

    footer {

      padding: 30px 5vw 25px;

      text-align: center;

      color: #68655f;

      font-size: .52rem;

      letter-spacing: .28em;

      text-transform: uppercase;

    }


    /* =====================================================
       MOBILE
       ===================================================== */

    @media (max-width: 800px) {


      header {

        padding: 26px 7vw;

      }


      .brand-main {

        font-size: 1.05rem;

      }


      main {

        padding:

          120px 24px 60px;

      }


      h1 {

        font-size:

          clamp(3.5rem, 16vw, 6rem);

      }


      .manifesto-text {

        font-size: .82rem;

        line-height: 1.8;

      }


      .discover {

        width: 100%;

        max-width: 300px;

      }


    }


    /* =====================================================
       SMALL MOBILE
       ===================================================== */

    @media (max-width: 420px) {


      main {

        padding-top: 115px;

      }


      h1 {

        font-size: 3.5rem;

      }


      .divider {

        margin-top: 35px;

        margin-bottom: 32px;

      }


    }


  </style>

</head>


<body>


  <div class="page">


    <!-- =================================================
         HEADER
         ================================================= -->

    <header>


      <a
        href="index.html"
        class="brand"
        aria-label="WORKSHOP THE CODE Home"
      >


        <div class="brand-main">

          WORKSHOP

        </div>


        <div class="brand-sub">

          <span class="line"></span>

          <span>

            THE CODE

          </span>

          <span class="line"></span>

        </div>


      </a>


    </header>



    <!-- =================================================
         MAIN
         ================================================= -->

    <main>


      <section class="manifesto">


        <div class="eyebrow">

          THE CODE

        </div>


        <h1>

          THE<br>

          MANIFESTO

        </h1>


        <div class="divider"></div>


        <div class="manifesto-text">


          <p>

            We don't sell clothing.

            We create symbols.

          </p>


          <br>


          <p>

            Every Code represents a value.

            Every value defines a person.

          </p>


          <br>


          <p>

            The garment is only the beginning.

            <strong>

              The Code lives in the one who wears it.

            </strong>

          </p>


        </div>



        <!-- =============================================
             DISCOVER
             ============================================= -->

        <div class="cta">


          <a
            href="code-destinations.html"
            class="discover"
          >

            DISCOVER YOUR CODE

            <span>

              →

            </span>

          </a>


          <a
            href="index.html"
            class="back"
          >

            ← BACK

          </a>


        </div>


      </section>


    </main>



    <!-- =================================================
         FOOTER
         ================================================= -->

    <footer>

      BUILT BY WORK. DEFINED BY VALUES.

    </footer>


  </div>


</body>

</html>
