
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080706">
<title>THE CODE — ORIGIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #080706;
  --paper: #f2f0ea;
  --accent: #b8793d;
  --line: rgba(190,132,76,.45);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(86,57,35,.18),transparent 55%),
    var(--bg);
  color: var(--paper);
  font-family: Inter,Arial,sans-serif;
}
.page {
  width: min(100% - 28px,1800px);
  margin: 0 auto;
  padding: 26px 0 34px;
}
.topline {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin: 0 2px 20px;
}
.brand,.collection {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .24em;
  text-transform: uppercase;
}
.brand { color: var(--paper); }
.collection { color: var(--accent); }
.code-grid {
  display: grid;
  grid-template-columns: repeat(5,minmax(0,1fr));
  gap: 10px;
}
.code-card {
  display: block;
  position: relative;
  overflow: hidden;
  background: #15110e;
  border: 1px solid var(--line);
  line-height: 0;
  text-decoration: none;
}
.code-card img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 297 / 504;
  object-fit: cover;
  transition: transform .55s ease,filter .55s ease;
}
.code-card:hover img,
.code-card:focus-visible img {
  transform: scale(1.025);
  filter: brightness(1.12);
}
.code-card:focus-visible {
  outline: 2px solid var(--paper);
  outline-offset: 3px;
}
@media(max-width:1100px) {
  .code-grid { grid-template-columns: repeat(3,minmax(0,1fr)); }
}
@media(max-width:680px) {
  .page {
    width: min(100% - 16px,520px);
    padding-top: 16px;
  }
  .topline { margin-bottom: 12px; }
  .code-grid {
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 7px;
  }
  .brand,.collection {
    font-size: 9px;
    letter-spacing: .16em;
  }
}
@media(prefers-reduced-motion:reduce) {
  .code-card img { transition: none; }
}
</style>
</head>

<body>
<main class="page">
  <header class="topline">
    <div class="brand">WORKSHOP · THE CODE</div>
    <div class="collection">THE ORIGIN</div>
  </header>

  <section class="code-grid" aria-label="Colección The Origin">

    <a class="code-card" href="code001.html">
      <img src="images/origin-001.jpg" alt="Code 001 — The Origin">
    </a>

    <a class="code-card" href="code002.html">
      <img src="images/origin-002.jpg" alt="Code 002 — Sacrifice">
    </a>

    <a class="code-card" href="code003.html">
      <img src="images/origin-003.jpg" alt="Code 003 — Discipline">
    </a>

    <a class="code-card" href="code004.html">
      <img src="images/origin-004.jpg" alt="Code 004 — True Friend">
    </a>

    <a class="code-card" href="code005.html">
      <img src="images/origin-005.jpg" alt="Code 005 — Loyalty">
    </a>

    <a class="code-card" href="code006.html">
      <img src="images/origin-006.jpg" alt="Code 006 — Responsibility">
    </a>

    <a class="code-card" href="code007.html">
      <img src="images/origin-007.jpg" alt="Code 007 — Respect">
    </a>

    <a class="code-card" href="code008.html">
      <img src="images/origin-008.jpg" alt="Code 008 — Humility">
    </a>

    <a class="code-card" href="code009.html">
      <img src="images/origin-009.jpg" alt="Code 009 — Legacy">
    </a>

    <a class="code-card" href="code010.html">

  </section>
</main>
</body>
</html>
